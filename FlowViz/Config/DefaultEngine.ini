[/Script/EngineSettings.GameMapsSettings]
; L_CapTest is the ONE map in Content -- the capture test level. The previous
; value named L_FlowVizMain, which never existed; the cook warned ("Unable to
; find package") and the packaged app exited at startup with MapNotFound
; before ExecCmds ever ran. A default map must be a map that ships.
GameDefaultMap=/Game/FlowViz/Maps/L_CapTest.L_CapTest
EditorStartupMap=/Game/FlowViz/Maps/L_CapTest.L_CapTest
; GlobalDefaultGameMode is set once AFlowVizGameModeBase exists in FlowVizApp.
; Pointing this at a non-existent class silently spawns no player/camera and
; renders black frames, which is easy to misdiagnose as a GPU/RHI failure.
GlobalDefaultGameMode=/Script/Engine.GameModeBase

