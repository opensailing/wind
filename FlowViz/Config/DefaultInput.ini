[/Script/Engine.InputSettings]
bAltEnterTogglesFullscreen=True
bCaptureMouseOnLaunch=False
; CaptureDuringMouseDown, not NoCapture: mouse AXIS deltas (MouseX/MouseY)
; only flow to the pawn while the viewport has capture, so under NoCapture
; the orbit camera could zoom (wheel is an event) but never orbit or pan
; (drags are axes). Capture only during the drag leaves the cursor free
; for the Slate panels the rest of the time.
DefaultViewportMouseCaptureMode=CaptureDuringMouseDown
DefaultViewportMouseLockMode=DoNotLock
bDefaultViewportMouseLock=False
bEnableMouseSmoothing=False
bUseMouseForTouch=False
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent
