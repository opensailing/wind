[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cfdviz"
version = "1.0.0"
description = "Reference reader/writer and mock case generator for the CFDViz 1.0 case format"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "FlowViz contributors" }]
keywords = ["cfd", "visualization", "lattice-boltzmann", "scientific-data"]

# NOTE: zstandard is deliberately NOT a dependency. See Docs/ADR/005-compression-codec.md
# and Docs/CFDVIZ_FORMAT.md section 7: UE 5.8 ships no linkable C++ zstd, so the
# shipping codec is zlib (Python standard library, engine-native on the Unreal side).
dependencies = [
    "numpy>=1.24,<3",
]

[project.optional-dependencies]
lz4 = ["lz4>=4.3,<5"]
test = ["pytest>=7.4,<9"]
schema = ["jsonschema>=4.20,<5"]
dev = ["pytest>=7.4,<9", "jsonschema>=4.20,<5", "lz4>=4.3,<5"]

[project.scripts]
cfdviz = "cfdviz.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cfdviz = ["schema/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["error::RuntimeWarning"]
